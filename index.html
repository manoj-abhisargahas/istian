<!DOCTYPE html>
<html>
	<head>
		<title>Istian</title>
		<link href="v.ico" rel="icon">
		<link href="index-style.css" rel="stylesheet">
		<link href="digitalnotice/css/app-name-style.css" rel="stylesheet">
		<meta name="viewport" content="user-scalable=no, initial-scale=1, minimum-scale=1, maximum-scale=1, width=device-width, height=device-height">
		<meta name="theme-color" content="#f9f9f9">
		<meta name="msapplication-navbuttton-color" content="#f9f9f9">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="#f9f9f9">

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
	</head>
	<body>
		<div class="container" align="center">
			<div>
				<h1 class="head-txt">N.B.K.R.I.S.T</h1>
			</div>
			<div class="digitalnotice-wrapper">
				<div class="digitalnotice">
					<!-- The Raw SVG Border -->
					<svg class="dash-border" viewbox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
						<rect x="1" y="2" width="98" height="96"/>
					</svg>
					<a href="digitalnotice/">
						<div class="app-name" href="">
							<span class="app-name-part-digital_notice">
								<span>D</span><span>i</span><span>g</span><span>i</span><span>t</span><span>a</span><span>l</span>
								<span class="app-name-part-notice">Notice</span>
							</span>
						</div>
						<span class="skltn"></span>
						<span class="skltn"></span>
					</a>
					<img class="post-icon" src="images/post-icon.png">
				</div>
			</div>
			<div class="btm-road-patch"></div>
			<div class="img-wrapper">
				<img class="college" width="100%" height="auto" src="images/college_crop.png"/>
			</div>
			<div class="car-1">
				<marquee direction="right" behavior="" scrollamount="50">
					<img width="200" height="80" src="images/Red_Car_Design(to-right).png" style="object-fit: cover;">
				</marquee>
			</div>
			<div class="car-2">
				<marquee direction="left" behavior="" scrollamount="80">
					<img width="200" height="80" src="images/Black_Car_Design(to-left).png">
				</marquee>
			</div>
			<div class="car-3">
				<marquee direction="left" behavior="" scrollamount="40">
					<img width="200" height="80" src="images/White_Car_Design(to-left).png">
				</marquee>
			</div>
		</div>
	</body>
</html>
